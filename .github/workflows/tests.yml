name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          VK_TOKEN: test-token
          GROUP_ID: '123456'
          CHAT_PEER_ID: '2000000002'
          MODERATION_CHAT_PEER_ID: '2000000001'
        run: python -m unittest discover -s tests -v
